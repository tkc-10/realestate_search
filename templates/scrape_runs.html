{% extends "base.html" %}
{% block title %}実行ログ - 不動産トラッカー{% endblock %}

{% block content %}
{% set active_page = 'runs' %}

<h1 class="text-2xl font-bold text-gray-900 mb-6">スクレイピング実行ログ</h1>

<!-- フィルター -->
<div class="bg-white rounded-lg shadow p-4 mb-6 flex gap-3">
  <select id="f-config" class="border border-gray-300 rounded-md px-3 py-2 text-sm">
    <option value="">全ての検索条件</option>
    {% for config in configs %}
    <option value="{{ config.id }}">{{ config.name }} ({{ config.site.display_name }})</option>
    {% endfor %}
  </select>
  <button onclick="loadRuns()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm py-2 px-4 rounded-md">絞り込み</button>
</div>

<div class="bg-white rounded-lg shadow">
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">検索条件</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">サイト</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">開始日時</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500">所要時間</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500">発見</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500">新規</th>
          <th class="px-4 py-3 text-right text-xs font-medium text-gray-500">終了</th>
          <th class="px-4 py-3 text-center text-xs font-medium text-gray-500">状態</th>
          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">エラー</th>
        </tr>
      </thead>
      <tbody id="runs-tbody" class="divide-y divide-gray-100">
        <tr><td colspan="9" class="text-center py-8 text-gray-400">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function loadRuns() {
  const configId = document.getElementById('f-config').value;
  let url = '/api/scrape-runs?limit=100';
  if (configId) url += '&config_id=' + configId;

  fetch(url).then(r => r.json()).then(runs => {
    const tbody = document.getElementById('runs-tbody');
    if (!runs.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-gray-400">実行履歴がありません</td></tr>';
      return;
    }
    tbody.innerHTML = runs.map(r => `
      <tr>
        <td class="px-4 py-3 font-medium text-gray-900">${r.config_name}</td>
        <td class="px-4 py-3">
          <span class="text-xs px-1.5 py-0.5 rounded ${r.site_name === '楽待' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}">${r.site_name}</span>
        </td>
        <td class="px-4 py-3 text-gray-600">${formatDate(r.started_at)}</td>
        <td class="px-4 py-3 text-right text-gray-600">${r.duration_seconds != null ? r.duration_seconds + '秒' : '-'}</td>
        <td class="px-4 py-3 text-right">${r.properties_found}</td>
        <td class="px-4 py-3 text-right text-green-600 font-medium">${r.properties_new > 0 ? '+' + r.properties_new : r.properties_new}</td>
        <td class="px-4 py-3 text-right text-red-500 font-medium">${r.properties_delisted > 0 ? r.properties_delisted : '-'}</td>
        <td class="px-4 py-3 text-center"><span class="badge-${r.status}">${r.status}</span></td>
        <td class="px-4 py-3 text-xs text-red-500 max-w-xs truncate" title="${r.error_message || ''}">${r.error_message || '-'}</td>
      </tr>
    `).join('');
  });
}
loadRuns();
</script>
{% endblock %}
